name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Static checks and Mock tests
        shell: pwsh
        run: ./scripts/check.ps1 -Suite Python
      - name: File and security hooks
        run: uv run --no-sync pre-commit run --all-files

  r-e2e:
    name: R / DESeq2 / Mock-planner end-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
    steps:
      - uses: actions/checkout@v4.3.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: '0.12.5'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: false
      - name: R compilation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libcurl4-openssl-dev libssl-dev libxml2-dev libpng-dev zlib1g-dev libbz2-dev liblzma-dev libicu-dev libuv1-dev
      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: ${{ hashFiles('renv.lock') }}
      - name: Make the restored library available in RRunner attempt directories
        shell: Rscript {0}
        run: |
          cat(paste0("R_LIBS=", renv::paths$library(), "\n"),
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)
      # All planner calls use test doubles. This job has no model credentials.
      - name: Restore, verify R environment, testthat and real DESeq2 workflow
        shell: pwsh
        run: ./scripts/check.ps1 -Suite R
