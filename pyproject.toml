[project]
name = "bio-agent"
version = "0.1.0"
description = "A reproducible human-in-the-loop bioinformatics agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "jinja2>=3.1,<4",
  "keyring>=25.7.0",
  "langchain-ollama>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "mcp==2.2.0",
  "pandas>=2.3,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "psutil==7.1.0",
  "pyyaml>=6,<7",
  "streamlit>=1.48,<2",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
rag = [
  "docling==2.58.0",
  "docling-core==2.101.1",
  "docling-ibm-models==3.15.0",
  "docling-parse==4.7.3",
  "torch==2.14.1",
  "rapidocr==3.10.0",
  "onnxruntime==1.31.0",
  "transformers==4.57.6",
  "qdrant-client==1.15.1",
]

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pandas-stubs>=2.3,<3",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-PyYAML>=6,<7",
  "types-psutil>=7,<8",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bioagent"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bioagent"]
